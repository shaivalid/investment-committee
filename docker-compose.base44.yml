services:
  app:
    image: python:3.12-slim
    working_dir: /repo/backend
    volumes:
      - ./:/repo
      - venv:/repo/backend/.venv
      - uvcache:/root/.cache/uv
    environment:
      - UV_LINK_MODE=copy
    env_file:
      - path: /run/base44/app.env
        required: false
    command:
      - sh
      - -ec
      - |
        pip install -q uv
        uv sync --frozen
        exec uv run uvicorn committee.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir ../web
    ports:
      - "3000:8000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/config',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  venv:
  uvcache:
